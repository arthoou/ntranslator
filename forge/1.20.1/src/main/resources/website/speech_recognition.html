<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>%I18N_TITLE%</title>
    <link rel="stylesheet" href="/speech.css">
</head>
<body>
    <main class="stage">
        <div class="player-stack">
            <div class="bubble-stack" id="bubble_stack"></div>

            <span class="player-name" id="player_name">%PLAYER_NAME%</span>
            <img class="player-head" id="player_skin" src="%PLAYER_SKIN%" alt="%PLAYER_NAME%">
        </div>
    </main>

    <footer class="made-by">Made by arthou</footer>

    <div class="pause-screen" id="pause">
        <h2>%I18N_PAUSED%</h2>
        <p>%I18N_PAUSED_DESC%</p>
    </div>

    <script src="/index.js"></script>
</body>
</html>
